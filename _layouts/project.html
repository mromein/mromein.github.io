<!DOCTYPE html>
<html lang="en">
{% capture style %}{% include project.scss %}{% endcapture %}
{% include head.html %}
<body class="project-page">
{% include header.html %}
{% assign p = page %}

{% include project-hero.html p=p %}
{% include project-info.html p=p %}
{% include project-media.html p=p %}
{% include project-foot.html %}

<div class="lightbox" id="lightbox" hidden role="dialog" aria-modal="true" aria-label="Image viewer"><button class="lightbox__close" type="button" aria-label="Close">&times;</button><button class="lightbox__prev" type="button" aria-label="Previous image">{% include arrow.svg %}</button><img class="lightbox__img" alt=""><button class="lightbox__next" type="button" aria-label="Next image">{% include arrow.svg %}</button></div>

<script type="text/javascript">
(function(){
  // Hero: swap the poster for the embed on play. The iframe ships with data-src so no player bytes load until then.
  var play = document.getElementById("project-hero__play");
  var hero = document.getElementById("project-hero");
  var poster = document.getElementById("project-hero__poster");
  var frame = hero ? hero.querySelector("iframe") : null;
  if (play && frame) {
    play.addEventListener("click", function(e){
      e.preventDefault();
      var src = frame.getAttribute("data-src") || "";
      src += (src.indexOf("?") === -1 ? "?" : "&") + "autoplay=1";
      frame.setAttribute("src", src);
      frame.removeAttribute("data-src");
      setTimeout(function(){
        poster.style.opacity = 0;
        poster.style.pointerEvents = "none";
      }, 500);
    });
  }

  // Desktop only: fade the nav after half a second of no input (unchanged behaviour).
  var nav = document.getElementById("main-nav");
  var isTouch = /iPad|Android|webOS|iPhone|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
  var timer, navVisible = true;
  function hideNav(){ if (!isTouch && navVisible) { navVisible = false; nav.style.opacity = 0; } }
  function resetTimer(){
    clearTimeout(timer);
    if (!navVisible) { navVisible = true; nav.style.opacity = 1; }
    timer = setTimeout(hideNav, 500);
  }
  ["load","mousemove","mousedown","touchstart","click","scroll","keypress"].forEach(function(ev){
    window.addEventListener(ev, resetTimer, { passive: true });
  });

  // Converted GIFs: play only while on screen.
  var loops = document.querySelectorAll(".project-media__video");
  if ("IntersectionObserver" in window && loops.length) {
    var io = new IntersectionObserver(function(entries){
      entries.forEach(function(en){
        var v = en.target;
        if (en.isIntersecting) { v.play().catch(function(){}); } else { v.pause(); }
      });
    }, { rootMargin: "200px 0px" });
    loops.forEach(function(v){ io.observe(v); });
  }

  // Lightbox: click a grid image to load the full-resolution original.
  var zooms = Array.prototype.slice.call(document.querySelectorAll(".project-media__zoom"));
  var box = document.getElementById("lightbox");
  if (box && zooms.length) {
    var boxImg = box.querySelector(".lightbox__img");
    var btnClose = box.querySelector(".lightbox__close");
    var btnPrev = box.querySelector(".lightbox__prev");
    var btnNext = box.querySelector(".lightbox__next");
    var focusable = [btnClose, btnPrev, btnNext];
    var index = -1;
    var lastFocus = null;

    if (zooms.length < 2) {
      btnPrev.hidden = true;
      btnNext.hidden = true;
    }

    function preloadNext(){
      if (index < 0 || zooms.length < 2) { return; }
      var n = (index + 1) % zooms.length;
      var pre = new Image();
      pre.src = zooms[n].getAttribute("href");
    }

    function show(i){
      index = (i + zooms.length) % zooms.length;
      box.classList.add("is-loading");
      boxImg.src = zooms[index].getAttribute("href");
      var alt = zooms[index].querySelector("img");
      boxImg.alt = alt ? alt.getAttribute("alt") || "" : "";
    }

    boxImg.addEventListener("load", function(){
      box.classList.remove("is-loading");
      preloadNext();
    });

    boxImg.addEventListener("error", function(){
      box.classList.remove("is-loading");
    });

    function open(i, source){
      lastFocus = source || document.activeElement;
      show(i);
      box.hidden = false;
      document.body.classList.add("lightbox-open");
      btnClose.focus();
    }

    function close(){
      box.hidden = true;
      box.classList.remove("is-loading");
      document.body.classList.remove("lightbox-open");
      boxImg.removeAttribute("src");
      if (lastFocus && lastFocus.focus) { lastFocus.focus(); }
      lastFocus = null;
      index = -1;
    }

    zooms.forEach(function(a, i){
      a.addEventListener("click", function(e){
        e.preventDefault();
        open(i, a);
      });
    });

    btnClose.addEventListener("click", function(e){ e.preventDefault(); close(); });
    btnPrev.addEventListener("click", function(e){ e.preventDefault(); e.stopPropagation(); show(index - 1); });
    btnNext.addEventListener("click", function(e){ e.preventDefault(); e.stopPropagation(); show(index + 1); });

    // Backdrop closes; on narrow screens (no arrow buttons) tapping the image advances.
    box.addEventListener("click", function(e){
      if (e.target === boxImg) {
        if (window.matchMedia && window.matchMedia("(max-width: 599px)").matches && zooms.length > 1) { show(index + 1); }
        return;
      }
      if (e.target === box) { close(); }
    });

    document.addEventListener("keydown", function(e){
      if (box.hidden) { return; }
      if (e.key === "Escape") { e.preventDefault(); close(); return; }
      if (e.key === "ArrowLeft" && zooms.length > 1) { e.preventDefault(); show(index - 1); return; }
      if (e.key === "ArrowRight" && zooms.length > 1) { e.preventDefault(); show(index + 1); return; }
      if (e.key === "Tab") {
        var ring = focusable.filter(function(el){ return !el.hidden && el.offsetParent !== null; });
        var at = ring.indexOf(document.activeElement);
        var next = e.shiftKey ? at - 1 : at + 1;
        if (at === -1) { next = 0; }
        next = (next + ring.length) % ring.length;
        e.preventDefault();
        ring[next].focus();
      }
    });

    // Swipe to move between images.
    var touchX = null;
    box.addEventListener("touchstart", function(e){
      touchX = e.changedTouches[0].clientX;
    }, { passive: true });
    box.addEventListener("touchend", function(e){
      if (touchX === null || zooms.length < 2) { return; }
      var dx = e.changedTouches[0].clientX - touchX;
      touchX = null;
      if (Math.abs(dx) > 40) { show(dx < 0 ? index + 1 : index - 1); }
    }, { passive: true });
  }
})();
</script>
</body>
</html>
